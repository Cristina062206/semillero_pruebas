<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fondo">
        <div class="calculadora">
            <div class="salida">
                <div class="resumen">50 x 6 x 2</div>
                <div class="resultado">600</div>
            </div>
            <div class="linea">
                <div class="color"></div>
            </div>
            <div class="ingreso">
                <div class="columna1">
                    <div class="Borrar">C</div>
                    <div class="7">7</div>
                    <div class="4">4</div>
                    <div class="1">1</div>
                    <div class="vacio">.</div>
                </div>
                <div class="columna2">
                    <div class="signo">+/-</div>
                    <div class="8">8</div>
                    <div class="5">5</div>
                    <div class="2">2</div>
                    <div class="0">0</div>
                </div>
                <div class="columna3">
                    <div class="porcentaje">%</div>
                    <div class="9">9</div>
                    <div class="6">6</div>
                    <div class="3">3</div>
                    <div class="coma">,</div>
                </div>
                <div class="columna4">
                    <div class="div">/</div>
                    <div class="multi">x</div>
                    <div class="menos">-</div>
                    <div class="mas">+</div>
                    <div class="igual">=</div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
